<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Car Rental Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/index.html" class="brand">
      Car Rental Platform <span class="brand-badge">API Client</span>
    </a>
    <nav>
      <a href="/register.html">Register</a>
      <a href="/verify.html">Verify OTP</a>
      <a href="/login.html">Login</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1 class="card-title">Reset Your Password</h1>
      <p class="card-subtitle">Enter your account email to receive a 6-digit password reset code</p>

      <div id="alertBox" class="alert"></div>

      <form id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com">
          <p class="form-hint">We will send a 6-digit verification code to this address.</p>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Send Reset Code</button>
      </form>

      <div class="card-footer">
        Remembered your password? <a href="/login.html">Return to login</a>
      </div>
    </div>
  </main>

  <footer>
    Car Rental Platform Backend API &copy; 2026.
  </footer>
  <script src="/js/auth.js"></script>
</body>
</html>
