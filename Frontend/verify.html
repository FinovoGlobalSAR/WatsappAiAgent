<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - Car Rental Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/index.html" class="brand">
      Car Rental Platform <span class="brand-badge">API Client</span>
    </a>
    <nav>
      <a href="/register.html">Register</a>
      <a href="/verify.html" class="active">Verify OTP</a>
      <a href="/login.html">Login</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1 class="card-title">Verify Your Email</h1>
      <p class="card-subtitle">Enter the 6-digit code sent to your email</p>

      <div id="alertBox" class="alert"></div>

      <form id="verifyForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="otp">One-Time Verification Code</label>
          <input type="text" id="otp" name="otp" class="otp-box" maxlength="6" placeholder="123456" required autocomplete="one-time-code">
          <p class="form-hint">Code is 6 digits and expires in 10 minutes (maximum 5 attempts).</p>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-bottom: 0.75rem;">Verify Email</button>
        <button type="button" id="resendBtn" class="btn btn-secondary" style="width: 100%;">Resend Code</button>
      </form>

      <div class="card-footer">
        Back to <a href="/login.html">Login</a> or <a href="/register.html">Register</a>
      </div>
    </div>
  </main>

  <footer>
    Car Rental Platform Backend API &copy; 2026.
  </footer>
  <script src="/js/auth.js"></script>
</body>
</html>
