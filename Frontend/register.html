<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Car Rental Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/index.html" class="brand">
      Car Rental Platform <span class="brand-badge">API Client</span>
    </a>
    <nav>
      <a href="/register.html" class="active">Register</a>
      <a href="/verify.html">Verify OTP</a>
      <a href="/login.html">Login</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1 class="card-title">Create an Account</h1>
      <p class="card-subtitle">Sign up for car rental access</p>

      <div id="alertBox" class="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required autocomplete="family-name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password">
          <p class="form-hint">At least 12 characters with uppercase, lowercase, number, and special character.</p>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Create Account</button>
      </form>

      <div class="card-footer">
        Already have an account? <a href="/login.html">Log in here</a>
      </div>
    </div>
  </main>

  <footer>
    Car Rental Platform Backend API &copy; 2026.
  </footer>
  <script src="/js/auth.js"></script>
</body>
</html>
